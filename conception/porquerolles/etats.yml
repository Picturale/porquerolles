# Les états nommés de Porquerolles.
#
# Le moteur calcule un état à partir des mesures du jour, puis lit la note de
# chaque lieu pour cet état dans lieux.yml. La matrice n'est jamais indexée par
# une mesure brute : toujours par un état nommé. On peut donc enrichir la
# définition d'un état (ajouter la houle, la saison, l'heure) sans réécrire
# une seule ligne de la matrice.
#
# Premier état qui correspond gagne. Du plus spécifique au plus général.

principe_des_seuils: |
  Deux familles de seuils, pas une règle unique — corrigé le 3 août 2026
  après une revue croisée qui a montré que l'ancienne version de ce texte
  se contredisait elle-même (elle affirmait TOUS les seuils au-dessus du
  bruit de fond été, alors que mistral/est/brise_sud_est sont eux-mêmes
  dans cette fourchette).

  Les états "_fort" (mistral_fort 25, est_fort 20) signalent un épisode
  qui sort de l'ordinaire : leur seuil se déclenche sur l'exception,
  jamais sur la normale, et doit rester au-dessus du bruit de fond estival
  (12-20 noeuds).

  Les états de base (mistral 12, est 10, brise_sud_est 12) ne signalent
  pas une anomalie : ils NOMMENT le régime de vent du jour, y compris
  quand ce régime est la brise de mer ordinaire de l'après-midi. C'est
  explicite dans brise_sud_est lui-même : "quasi quotidienne en été, ce
  n'est pas un événement". Rendre ce nommage précis vaut mieux que de le
  masquer sous "Calme" — un vent de 12 noeuds n'est pas un non-événement
  pour le sable, même s'il est routinier.

unites:
  vent: noeuds        # jamais des km/h : c'est la convention lue en bord de mer
  houle: metres       # hauteur significative

etats:

  - id: mistral_fort
    nom: Mistral établi
    quand:
      direction: [270, 320]   # localement ouest à nord-ouest, PAS nord franc
      moyen_min: 25
    constat: >-
      Mistral établi. L'eau reste plate au nord — le fetch est trop court pour
      lever de la mer. Mais ça décape sur le sable.

  - id: mistral
    nom: Mistral
    quand:
      direction: [270, 320]
      moyen_min: 12

  - id: est_fort
    nom: Vent d'est
    quand:
      direction: [60, 120]
      moyen_min: 20
    constat: >-
      Vent d'est. La houle arrive avant le vent et déferle sur la côte
      nord-est. L'eau peut rester mauvaise le lendemain, vent tombé.

  # brise_sud_est avant est : sur leur recouvrement de direction (90-120°),
  # brise_sud_est est le plus specifique des deux (condition d'heure en
  # plus), donc doit gagner en premier — "premier qui correspond gagne, du
  # plus specifique au plus general" (voir l'en-tete de ce fichier). Avant
  # ce reordonnancement (revue croisee du 3 aout 2026), est etait place en
  # premier et brise_sud_est ne pouvait jamais se declencher sur ce
  # recouvrement, quelle que soit l'heure.
  - id: brise_sud_est
    nom: Brise de mer
    quand:
      direction: [90, 160]
      moyen_min: 12
      heure: [14, 19]
    constat: >-
      Brise de mer d'après-midi. Quasi quotidienne en été. Ce n'est pas un
      événement — la réponse du matin reste valable pour l'essentiel.

  - id: est
    nom: Vent d'est modéré
    quand:
      direction: [60, 120]
      moyen_min: 10

  # Comble un trou trouvé le 3 août 2026 : les secteurs [160,270[ (sud à
  # ouest) et [320,60[ (nord-ouest à nord-est) ne correspondent à aucun
  # état nommé ci-dessus — un vent fort de ces directions retombait sur
  # "Calme", l'état le plus permissif du système. Seuil (22 noeuds) repris
  # tel quel du deuxième palier de paliers_vent ci-dessous ("ça commence à
  # voler sur les parties exposées") plutôt qu'inventé : c'est déjà le
  # seuil que ce dossier utilise ailleurs pour dire "notable".
  #
  # VOLONTAIREMENT SANS NOTES DANS lieux.yml : aucune donnée de terrain
  # n'existe sur ces secteurs pour aucun lieu. Le moteur ne doit jamais
  # inventer un eau/sable/tranquillité ici — afficher que la direction est
  # hors du modèle, pas une note.
  - id: vent_fort_non_categorise
    nom: Vent fort, secteur non modélisé
    quand:
      direction: [160, 320]   # couvre les deux trous ; recouvre aussi
                                # mistral/est plus haut dans le fichier,
                                # mais eux gagnent d'abord (plus specifiques)
      moyen_min: 22
    constat: >-
      Vent fort mesuré dans un secteur que ce dossier n'a pas encore
      caractérisé (pas de fetch, pas de relief, pas de note de lieu).
      Aucune plage n'est notée pour cet état — ce n'est pas une absence de
      vent, c'est une absence de donnée.

  - id: calme
    nom: Calme
    defaut: true

# ---------------------------------------------------------------------------
# VETO DE VENT EXTRÊME — décision du 3 août 2026, suite à la revue croisée.
#
# etats.yml n'avait aucune borne supérieure : mistral_fort (>=25) et un
# coup de vent à 60 noeuds produisaient exactement le même état et les
# mêmes notes. Un palier existait déjà plus bas (paliers_vent, dernier
# palier "invivable à découvert") mais n'était câblé nulle part.
#
# Câblé ici, scope volontairement étroit : seul l'axe SABLE est écrasé à
# la note du palier orphelin, jamais l'eau ni la tranquillité. Motif :
# paliers_vent gouverne déjà explicitement le sable ("LE SABLE se juge au
# VENT", plus bas dans ce fichier) — étendre ce mécanisme à un seuil plus
# haut ne crée rien de nouveau. Écraser l'eau ou la tranquillité
# demanderait un modèle qui n'existe pas ici (l'eau dépend de la houle,
# pas du vent local) : ne pas l'inventer. Reste un vrai trou, documenté
# plutôt que comblé par une valeur inventée.
veto_vent_extreme:
  moyen_min: 30   # reprend tel quel la borne du dernier palier_vent
  axe: sable
  note: 0
  dit: "invivable à découvert"
  portee: "tous lieux, toutes directions — remplace la note sable calculée normalement"

# ---------------------------------------------------------------------------
# LE SABLE se juge au VENT.
# Le sable sec commence à voler vers 12-15 noeuds. En dessous, non-sujet.
# Ces paliers décrivent le vent, pas une plage : ce qu'une plage en subit
# dépend de son abri, qui est écrit à la main dans lieux.yml.

paliers_vent:
  - { max: 15, note: 5, dit: "rien à signaler" }
  - { max: 22, note: 3, dit: "ça commence à voler sur les parties exposées" }
  - { max: 30, note: 2, dit: "désagréable, chercher l'abri" }
  - { max: null, note: 0, dit: "invivable à découvert" }

# ---------------------------------------------------------------------------
# L'EAU se juge à la HOULE, pas au vent.
#
# C'est la particularité de Porquerolles et le coeur du produit. Un mistral à
# 30 noeuds laisse l'eau baignable au nord : 1,7 km de fetch au plus étroit de
# la Grande Passe, il n'a pas la place de lever de mer. Un vent d'est bien plus
# faible rend l'eau mauvaise, parce qu'il arrive précédé de sa houle.
#
# Source : bouée CANDHIS Porquerolles 08302. Mesure, pas prévision.
# Rafraîchie toutes les heures (cadence horaire confirmée par un appel direct
# à l'API le 02/08/2026, voir A-VERIFIER.md #3 — corrige l'estimation
# "30 à 60 minutes" écrite avant cette vérification).

paliers_houle:
  - { max: 0.3, note: 5, dit: "eau plate" }
  - { max: 0.6, note: 4, dit: "petites vagues" }
  - { max: 1.0, note: 2, dit: "agité" }
  - { max: null, note: 0, dit: "à éviter" }

# ATTENTION — correction obligatoire avant usage.
# La bouée est à 4-5 km au SUD de l'île : elle mesure la côte exposée.
# Sa valeur brute surestime toujours la côte nord. Le coefficient dépend de la
# direction de la houle. Ces valeurs sont déduites, pas mesurées : à caler.
attenuation_cote_nord:
  houle_sud_sud_ouest: 0.0    # côte nord totalement masquée par l'île
  houle_sud_est: 0.2
  houle_est: 0.8              # la côte nord-est encaisse
  houle_nord_est: 1.0
