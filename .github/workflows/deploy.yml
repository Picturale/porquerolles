# Déploie le portail Porquerolles (site/ Astro) sur GitHub Pages.
# PLAN-ATELIER A1 — Node ≥ 20, npm ci + build dans site/, publication de site/dist.
#
# Domaine custom : DEMANDER #9 tranché en intérim (5/08/2026) — Pages sous
# /porquerolles/ (base dans site/astro.config.mjs). Domaine custom plus tard →
# Cloudflare Pages (DECISIONS.md §14) et retrait du base.
#
# Remplace l'ancien workflow Firebase de l'app abandonnée (Phase I : ne plus
# déployer Vision Picturale depuis ce fichier).

name: Déployer le portail Porquerolles

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-porquerolles
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installer les dépendances
        working-directory: site
        run: npm ci

      - name: Construire le site
        working-directory: site
        run: npm run build

      - name: Vérifier le budget carte (< 50 ko)
        run: |
          set -e
          for f in site/dist/carte/*/index.html; do
            size=$(wc -c < "$f")
            echo "$f : ${size} octets"
            if [ "$size" -ge 51200 ]; then
              echo "BUDGET CARTE DÉPASSÉ : $f ≥ 50 ko" >&2
              exit 1
            fi
          done

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
