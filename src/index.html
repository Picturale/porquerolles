<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Picturale Community</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .section {
            height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .top-section {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .bottom-section {
            background-color: #ffffff;
        }
        
        /* Responsive - Paysage (landscape) */
        @media (orientation: landscape) {
            body {
                flex-direction: row;
            }
            
            .section {
                height: 100vh;
                width: 50vw;
            }
            
            .top-section {
                border-bottom: none;
                border-right: 1px solid #e2e8f0;
            }
        }
        
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            text-align: center;
        }
        
        .logo-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .logo-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .logo-title {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .logo-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
            margin: 0;
            letter-spacing: 0.5px;
        }
        
        .logo-subtitle {
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: -2px;
        }
        
        .description {
            font-size: 0.9rem;
            color: #718096;
            max-width: 300px;
            line-height: 1.4;
            margin: 0.5rem 0;
        }
        
        .enter-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .enter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        
        .top-section .enter-button {
            background: linear-gradient(135deg, #1a365d, #2d3748);
        }
        
        .top-section .enter-button:hover {
            box-shadow: 0 8px 25px rgba(26, 54, 93, 0.3);
        }
        
        .bottom-section .enter-button {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
        }
        
        .bottom-section .enter-button:hover {
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }
        
        .top-section .logo-subtitle {
            color: #1a365d;
        }
        
        .bottom-section .logo-subtitle {
            color: #ff6b35;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .logo-title h1 {
                font-size: 1.3rem;
            }
            
            .logo-subtitle {
                font-size: 0.8rem;
            }
            
            .logo-image {
                width: 50px;
                height: 50px;
            }
            
            .section {
                padding: 1rem;
            }
            
            .description {
                font-size: 0.8rem;
                max-width: 250px;
            }
            
            .enter-button {
                padding: 0.6rem 1.5rem;
                font-size: 0.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .logo-title h1 {
                font-size: 1.1rem;
            }
            
            .logo-subtitle {
                font-size: 0.7rem;
            }
            
            .logo-image {
                width: 40px;
                height: 40px;
            }
            
            .description {
                font-size: 0.75rem;
                max-width: 200px;
            }
            
            .enter-button {
                padding: 0.5rem 1.2rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Section du haut - Calibration Flow -->
    <div class="section top-section">
        <div class="logo-container">
            <div class="logo-header">
                <img src="./assets/logo2.png" alt="Calibration Flow Logo" class="logo-image">
                <div class="logo-title">
                    <h1>CALIBRATION</h1>
                    <span class="logo-subtitle">Flow</span>
                </div>
            </div>
            <p class="description">Calibrez vos négatifs pour une reproduction fidèle de vos images.</p>
            <a href="./core-app/" class="enter-button">Enter</a>
        </div>
    </div>
    
    <!-- Section du bas - Vision Picturale Connect -->
    <div class="section bottom-section">
        <div class="logo-container">
            <div class="logo-header">
                <img src="./assets/logo-a63a4dfb.jpg" alt="Vision Picturale Logo" class="logo-image">
                <div class="logo-title">
                    <h1>VISION PICTURALE</h1>
                    <span class="logo-subtitle">Connect</span>
                </div>
            </div>
            <p class="description">Rejoignez notre communauté de photographes artisans et partagez vos créations avec le monde.</p>
            <a href="./social-app/" class="enter-button">Enter</a>
        </div>
    </div>
</body>
</html>
