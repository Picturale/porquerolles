<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light only" />
  <title>Vision Picturale - Communauté</title>
  <meta name="description" content="Communauté et réseau social de Vision Picturale" />
  <meta name="theme-color" content="#667eea" />
  
  <!-- Cache Control Meta Tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="cache-control" content="no-cache" />
  <meta name="expires" content="0" />
  <meta name="pragma" content="no-cache" />
  
  <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <style>
    /* Force mode clair uniquement */
    :root {
      color-scheme: light only !important;
    }
    
    * {
      color-scheme: light only !important;
    }
    
    /* Base styles - Variables core-app */
    :root {
      --brand-primary: #ff6b35;
      --brand-blue: #002739;
      --brand-dark: #0f0d12;
      --brand-light: #ffffff;
      --brand-gray: #c7c7c7;
      --background: #f5f5f5;
      
      /* Compatibilité anciennes variables */
      --primary-color: #667eea;
      --primary-dark: #764ba2;
      --secondary-color: #ff6b35;
      --bg-color: #f9f9f9;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      line-height: 1.5;
    }

    /* Loading animation - Style core-app */
    .app-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--brand-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--brand-dark);
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    .loader-logo {
      font-size: 48px;
      margin-bottom: 20px;
      color: var(--brand-primary);
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--brand-gray);
      border-radius: 50%;
      border-top: 3px solid var(--brand-primary);
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 18px;
      color: var(--brand-blue);
      font-weight: 500;
    }
    
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="app-loader" class="app-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Chargement</div>
  </div>

  <div id="root"></div>
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getStorage } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';
    import { firebaseConfig } from './firebase.config.js';

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Make Firebase services available globally
    window.firebaseApp = app;
    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.firebaseStorage = storage;
    
    console.log('Firebase initialized successfully');
  </script>
  
  <!-- Application Entry -->
  <script type="module" src="./main.js"></script>
  
  <!-- Hide loader when app is loaded -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Set a timeout to ensure the app has some time to initialize
      setTimeout(() => {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.classList.add('hidden');
          
          // Remove the loader from DOM after transition completes
          setTimeout(() => {
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 500);
        }
      }, 1500); // Show loader for at least 1.5 seconds
    });
    
    // Fallback to hide loader if it's still visible after 5 seconds
    setTimeout(() => {
      const loader = document.getElementById('app-loader');
      if (loader && !loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
      }
    }, 5000);
  </script>
  
  <!-- Skimlinks Script for Brand Monetization -->
  <script type="text/javascript" src="https://s.skimresources.com/js/289184X1776102.skimlinks.js"></script>
</body>
</html>
