<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/camera.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <title>noeme - Plateforme créative connectée</title>
  <meta name="description"
    content="Rejoignez noeme, la plateforme créative nouvelle génération. Partagez vos créations, collaborez avec des artistes et développez votre audience dans une communauté inspirante." />
  <meta name="theme-color" content="#667eea" />
  <style>
    /* Initial loading styles */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .app-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
      z-index: 1000;
    }

    .loader-logo {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .loader-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 107, 53, 0.3);
      border-radius: 50%;
      border-top: 3px solid #ff6b35;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Initial loading screen -->
  <div id="app-loader" class="app-loader">
    <div class="loader-logo">📸</div>
    <div class="loader-spinner"></div>
    <div>Chargement de noeme...</div>
  </div>

  <!-- React app root -->
  <div id="root"></div>

  <!-- Entry point script -->
  <script type="module" src="./index.jsx"></script>
</body>

</html>
